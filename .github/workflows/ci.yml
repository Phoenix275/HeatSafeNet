name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint tests and benchmarks
        run: ruff check tests benchmarks
      - name: Test
        run: pytest -q
      - name: Benchmark (exact vs greedy)
        run: python benchmarks/bench_mclp.py
